services:
  - type: web
    name: controle-pcm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120
    plan: free
    envVars:
      - key: DB_HOST
        value: rdscontroladoria-read.grupojapungu.com
      - key: DB_USER
        value: caio_souza
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: syscustoWeb
      - key: PYTHON_VERSION
        value: "3.11.0"
