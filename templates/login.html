<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão PCM</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --accent: #1E4B9A; --accent-hi: #3D77D6; }
        body {
            background-color: #0b1220; margin: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: 'Calibri', Arial, sans-serif;
        }
        #dotFieldBg { position: fixed; inset: 0; z-index: 0; }

        .login-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; animation: loginIn .5s cubic-bezier(.16,.84,.44,1) both; }
        @keyframes loginIn { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

        .login-brand { text-align: center; margin-bottom: 22px; }
        .login-brand .icon {
            width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--accent-hi), var(--accent));
            display: grid; place-items: center; color: #fff; font-size: 1.6rem;
            box-shadow: 0 10px 28px rgba(30,75,154,.45);
        }
        .login-brand h1 { color: #f1f5f9; font-size: 1.1rem; font-weight: 700; letter-spacing: .4px; margin: 0; }
        .login-brand span { color: #7c8aa5; font-size: .78rem; }

        .login-card {
            --border-radius: 20px;
            background: rgba(20, 26, 41, 0.72);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: var(--border-radius);
            box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
            padding: 34px 30px 26px;
        }

        .form-floating > label { color: #94a3b8; }
        .login-card .form-control {
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
            color: #f1f5f9; border-radius: 12px; padding: .95rem 1rem;
        }
        .login-card .form-control:focus {
            background: rgba(255,255,255,.08); border-color: var(--accent-hi); color: #fff;
            box-shadow: 0 0 0 .2rem rgba(61,119,214,.25);
        }
        .login-card .form-control::placeholder { color: #64748b; }
        .login-card .form-label { color: #94a3b8; font-size: .78rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }

        .btn-entrar {
            background: linear-gradient(135deg, var(--accent-hi), var(--accent));
            border: none; color: #fff; font-weight: 700; letter-spacing: .5px;
            border-radius: 12px; padding: .8rem 1rem;
            box-shadow: 0 10px 24px rgba(30,75,154,.4);
            transition: transform .18s, box-shadow .18s;
        }
        .btn-entrar:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(30,75,154,.5); color: #fff; }
        .btn-entrar:active { transform: translateY(0); }

        .login-voltar { color: #7c8aa5; font-size: .82rem; text-decoration: none; transition: color .15s; }
        .login-voltar:hover { color: #cbd5e1; }

        .login-alert {
            background: rgba(220,53,69,.12); border: 1px solid rgba(220,53,69,.35);
            color: #ff9aa5; border-radius: 10px; font-size: .85rem;
        }
    </style>
</head>
<body>
    <div id="dotFieldBg"></div>

    <div class="login-wrap">
        <div class="login-brand">
            <div class="icon"><i class="bi bi-gear-fill"></i></div>
            <h1>GESTÃO PCM</h1>
            <span>CRV Industrial</span>
        </div>

        <div class="login-card" id="loginCard">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="login-alert alert py-2 text-center small mb-3">{% for message in messages %}{{ message }}{% endfor %}</div>
              {% endif %}
            {% endwith %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Utilizador / Perfil</label>
                    <input type="text" class="form-control" name="usuario" placeholder="ex: ADMIN" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Palavra-passe</label>
                    <input type="password" class="form-control" name="senha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-entrar w-100">ENTRAR</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="login-voltar"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dot-field.js') }}"></script>
    <script>
        DotField.mount(document.getElementById('dotFieldBg'), {
            dotRadius: 1.5,
            dotSpacing: 14,
            bulgeStrength: 67,
            glowRadius: 160,
            sparkle: false,
            waveAmplitude: 0,
            gradientFrom: '#1E4B9A',
            gradientTo: '#3D77D6',
            glowColor: '#6ea8fe'
        });
    </script>
</body>
</html>
