<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão PCM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #e9ecef; } .login-container { max-width: 420px; margin-top: 12vh; } </style>
</head>
<body>
    <div class="container login-container">
        <div class="card shadow border-0 rounded-3">
            <div class="card-header bg-dark text-white text-center py-3"><h5 class="mb-0">Acesso ao Sistema</h5></div>
            <div class="card-body p-4">
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-danger py-2 text-center small">{% for message in messages %}{{ message }}{% endfor %}</div>
                  {% endif %}
                {% endwith %}
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Utilizador / Perfil</label>
                        <input type="text" class="form-control" name="usuario" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Palavra-passe</label>
                        <input type="password" class="form-control" name="senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">ENTRAR</button>
                    <p class="small text-muted mt-3 mb-0"></p>
                </form>
            </div>
            <div class="card-footer text-center bg-transparent border-0 pb-3"><a href="/" class="text-decoration-none text-muted small">← Voltar</a></div>
        </div>
    </div>
</body>
</html>
